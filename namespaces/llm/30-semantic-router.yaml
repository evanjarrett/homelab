# vLLM Semantic Router: one OpenAI-compatible entry point for the local models.
#
#   client -> llm-gateway (Istio Gateway, Envoy) --ext_proc--> semantic-router
#                 |  router classifies the request and sets x-selected-model
#                 +-- x-selected-model: qwen   -> llama-server (Strix, llama.cpp)
#                 +-- x-selected-model: vision -> vllm-vision  (B50, vLLM)
#                 +-- no header (router down; failure_mode_allow) -> llama-server
#
# Endpoint: http://llm-gateway-istio.llm.svc.cluster.local:8080/v1 in-cluster,
# https://llm.j5t.io/v1 on the LAN (route in 10-httproute.yaml).
# SHADOW MODE (2026-11-15): decisions named shadow-* are evaluated and counted
# (llm_decision_match_total / llm_signal_match_total, scraped into VictoriaMetrics)
# but route exactly as before (image -> vision, else qwen). Each shadow decision's
# description says where it WOULD route. Grafana/VM: sum by (decision_name)
# (increase(llm_decision_match_total[1d])); per-request detail in the router's
# routing_decision log lines (kubectl -n llm logs deploy/semantic-router).
#
# Clients send model "auto" (or "vllm-sr/auto") to be routed; a request naming a
# configured model ("qwen", "vision") goes straight to it.
#
# Router config is the chart's canonical document (configOverride). Bump
# configMap.applyValuesRevision when changing it, or Helm keeps the live
# ConfigMap (the router's management API may edit it in place).
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: semantic-router-helmrelease
  namespace: llm
spec:
  releaseName: semantic-router
  interval: 30m
  chart:
    spec:
      chart: semantic-router
      version: 0.4.0
      sourceRef:
        kind: HelmRepository
        name: vllm-semantic-router-helmrepo
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      tag: v0.4.0
    persistence:
      enabled: true
      storageClassName: longhorn-v2
      size: 10Gi
    nodeSelector:
      storage.longhorn-v2: 'true'
    resources:
      requests:
        cpu: 500m
        memory: 3Gi
      limits:
        cpu: '4'
        memory: 6Gi
    configMap:
      applyValuesRevision: '3'
    configOverride:
      version: v0.3
      listeners:
      - name: grpc-50051
        address: 0.0.0.0
        port: 50051
        timeout: 300s
      global:
        router:
          include_config_models_in_list: true
          auto_model_names:
          - auto
          - vllm-sr/auto
        stores:
          response_cache:
            enabled: false
            backend_type: memory
        integrations:
          tools:
            enabled: false
        model_catalog:
          system:
            pii_classifier: models/Vela-1.0-Encoder-307M-PII
          embeddings:
            semantic:
              mmbert_model_path: models/Vela-1.0-Encoder-307M-Embedding
              use_cpu: true
              embedding_config:
                backend: candle
                model_type: mmbert
                preload_embeddings: true
                full_context: false
                target_dimension: 0
                target_layer: 22
                min_score_threshold: 0.45
      providers:
        defaults:
          model: qwen
        models:
        - name: qwen
          provider_model_id: qwen3.8-27b
          api_format: openai
          backend_refs:
          - name: llama-server
            provider: vllm
            endpoint: llama-server.llm.svc.cluster.local:8080
            protocol: http
            weight: 1
        - name: vision
          provider_model_id: vision
          api_format: openai
          backend_refs:
          - name: vllm-vision
            provider: vllm
            endpoint: vllm-vision.llm.svc.cluster.local:8080
            protocol: http
            weight: 1
      routing:
        modelCards:
        - name: qwen
          description: 'Main local model: Qwen3.8-27B + MTP on the Strix Halo (llama.cpp).'
          context_window_size: 262144
          modality: text
        - name: vision
          description: Qwen3.5-9B on an Arc Pro B50 (vLLM); image understanding.
          context_window_size: 32768
          modality: omni
          capabilities:
          - vision
          - image_understanding
          - text
        signals:
          input_modality:
          - description: Request contains at least one image content part.
            modality: image
            name: image_input
          pii:
          - name: personal_data
            threshold: 0.85
            include_history: true
            description: 'Personal data anywhere in the conversation: must never leave
              the house.'
          context:
          - name: fits_fastlane
            min_tokens: '0'
            max_tokens: 24K
            description: Fits the B50 vision model's 32K window with room to answer.
          - name: beyond_local
            min_tokens: 128K
            max_tokens: 1M
            description: Long enough that local models get slow or run out of window.
          keywords:
          - name: escalate_request
            operator: OR
            case_sensitive: false
            keywords:
            - use claude
            - ask claude
            - escalate
            - think hard
            - think harder
            - deep dive
          conversation:
          - name: has_tools
            description: Request defines at least one tool.
            feature:
              type: count
              source:
                type: tool_definition
            predicate:
              gte: 1
          complexity:
          - name: difficulty
            threshold: 0.1
            description: Easy vs hard household / homelab requests.
            hard:
              candidates:
              - debug why this kubernetes deployment keeps crashing and propose a
                fix
              - write a program that parses these logs and reports anomalies
              - analyze the root cause of this failure
              - compare multiple design tradeoffs and recommend one
              - plan a multi-step migration with rollback steps
              - refactor this code and explain the changes
              - solve this step by step and show your reasoning
            easy:
              candidates:
              - what's the weather like today
              - summarize this email briefly
              - give this chat a short title
              - rewrite this sentence to sound friendlier
              - what time does the store close
              - translate this to spanish
              - answer briefly
        decisions:
        - name: vision-request
          description: 'LIVE: image-bearing requests go to the B50 vision model.'
          priority: 1000
          rules:
            operator: AND
            conditions:
            - type: input_modality
              name: image_input
          modelRefs:
          - model: vision
            use_reasoning: false
        - name: shadow-pii-local
          description: 'SHADOW: personal data -> would be pinned local (never Claude).
            Routes to qwen.'
          priority: 900
          rules:
            operator: AND
            conditions:
            - type: pii
              name: personal_data
          modelRefs:
          - model: qwen
            use_reasoning: false
        - name: shadow-claude-explicit
          description: 'SHADOW: user asked to escalate -> would go to Claude. Routes
            to qwen.'
          priority: 700
          rules:
            operator: AND
            conditions:
            - type: keyword
              name: escalate_request
          modelRefs:
          - model: qwen
            use_reasoning: false
        - name: shadow-claude-long
          description: 'SHADOW: >=128K tokens -> would go to Claude. Routes to qwen.'
          priority: 600
          rules:
            operator: AND
            conditions:
            - type: context
              name: beyond_local
          modelRefs:
          - model: qwen
            use_reasoning: false
        - name: shadow-claude-hard
          description: 'SHADOW: hard request -> would go to Claude. Routes to qwen.'
          priority: 500
          rules:
            operator: AND
            conditions:
            - type: complexity
              name: difficulty:hard
          modelRefs:
          - model: qwen
            use_reasoning: false
        - name: shadow-fastlane
          description: 'SHADOW: easy and short -> would go to the B50 fast lane. Routes
            to qwen.'
          priority: 400
          rules:
            operator: AND
            conditions:
            - type: complexity
              name: difficulty:easy
            - type: context
              name: fits_fastlane
          modelRefs:
          - model: qwen
            use_reasoning: false
        - name: default-route
          description: 'LIVE: everything else goes to the main model.'
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
          - model: qwen
            use_reasoning: false
  postRenderers:
  - kustomize:
      patches:
      - target:
          kind: Service
          name: semantic-router-metrics
        patch: "- op: add\n  path: /metadata/annotations/prometheus.io~1scrape\n \
          \ value: \"true\"\n- op: add\n  path: /metadata/annotations/prometheus.io~1port\n\
          \  value: \"9190\"\n"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-gateway
  namespace: llm
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: istio
  listeners:
  - name: http
    protocol: HTTP
    port: 8080
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: semantic-router-extproc
  namespace: llm
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: llm-gateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
      listener:
        filterChain:
          filter:
            name: envoy.filters.network.http_connection_manager
    patch:
      operation: INSERT_FIRST
      value:
        name: envoy.filters.http.ext_proc
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          failure_mode_allow: true
          allow_mode_override: false
          message_timeout: 300s
          processing_mode:
            request_header_mode: SEND
            response_header_mode: SEND
            request_body_mode: BUFFERED
            response_body_mode: NONE
            request_trailer_mode: SKIP
            response_trailer_mode: SKIP
          grpc_service:
            envoy_grpc:
              cluster_name: outbound|50051||semantic-router.llm.svc.cluster.local
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: semantic-router
  namespace: llm
spec:
  host: semantic-router.llm.svc.cluster.local
  trafficPolicy:
    tls:
      mode: DISABLE
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-gateway-models
  namespace: llm
spec:
  parentRefs:
  - name: llm-gateway
  rules:
  - backendRefs:
    - name: llama-server
      port: 8080
    timeouts:
      request: 600s
    matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - type: Exact
        name: x-selected-model
        value: qwen
  - backendRefs:
    - name: vllm-vision
      port: 8080
    timeouts:
      request: 600s
    matches:
    - path:
        type: PathPrefix
        value: /
      headers:
      - type: Exact
        name: x-selected-model
        value: vision
  - backendRefs:
    - name: llama-server
      port: 8080
    timeouts:
      request: 600s
    matches:
    - path:
        type: PathPrefix
        value: /

apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-models
spec:
  capacity:
    storage: 500Gi          # nominal; NFS ignores this
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""      # static binding, no provisioner
  mountOptions:
    - nfsvers=4.1
    - hard
    - nconnect=8            # parallel TCP streams to saturate the 2.5GbE link
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: llama-models-nfs
    volumeAttributes:
      server: "192.168.1.100"
      share: /mnt/Pool-1.18.6/kubernetes/llama-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models
  namespace: llm
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: llama-models
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      nodeSelector:
        feature.node.kubernetes.io/custom-amd.gpu: "true"
      initContainers:
        - name: download-models
          image: alpine:latest
          command:
            - sh
            - -c
            - |
              apk add --no-cache curl
              cd /models
              BASE="https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main"
              # Main model: Qwen3.8-27B dense (hybrid Gated-DeltaNet), 262K ctx.
              # Text-only here: images go to Qwen3.5-9B on a B50 (vllm-vision)
              # via the semantic router, so no mmproj is loaded.
              if [ ! -f "Qwen3.8-27B-UD-Q6_K.gguf" ]; then
                echo "Downloading Qwen3.8-27B UD-Q6_K..."
                curl -fL -# -o Qwen3.8-27B-UD-Q6_K.gguf.part "$BASE/Qwen3.8-27B-UD-Q6_K.gguf" && mv Qwen3.8-27B-UD-Q6_K.gguf.part Qwen3.8-27B-UD-Q6_K.gguf
              fi
              # MTP draft head for speculative decoding (~2x decode on this box).
              if [ ! -f "mtp-Qwen3.8-27B-Q4_0.gguf" ]; then
                echo "Downloading Qwen3.8-27B MTP head..."
                curl -fL -# -o mtp-Qwen3.8-27B-Q4_0.gguf.part "$BASE/MTP/mtp-Qwen3.8-27B-Q4_0.gguf" && mv mtp-Qwen3.8-27B-Q4_0.gguf.part mtp-Qwen3.8-27B-Q4_0.gguf
              fi
              echo "Models ready."
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: llama-server
          image: docker.io/kyuz0/amd-strix-halo-toolboxes:vulkan-radv
          imagePullPolicy: Always
          command: ["llama-server"]
          args:
            - "--model"
            - "/models/Qwen3.8-27B-UD-Q6_K.gguf"
            - "--alias"
            - "qwen3.8-27b,qwen3.6-35b"  # old name kept so existing clients (HA, Sure, git-summarizer, agent) keep working
            - "-ngl"
            - "999"                     # offload all layers to GPU
            - "-fa"
            - "on"                      # flash attention
            - "--jinja"                 # parse model template -> OpenAI tool_calls
            - "--chat-template-file"    # official template + one patch: allow later system messages
            - "/templates/chat_template.jinja"  #   (HA injects context mid-conversation; stock template raises)
            - "--reasoning"             # default thinking OFF; agent/coding opt in per request with
            - "off"                     #   chat_template_kwargs enable_thinking:true
            - "--spec-type"             # MTP speculative decoding: 19-20 tok/s vs ~10 without,
            - "draft-mtp"               #   ~65% draft acceptance (measured 2026-11-15)
            - "--model-draft"
            - "/models/mtp-Qwen3.8-27B-Q4_0.gguf"
            - "--spec-draft-ngl"
            - "all"
            - "--spec-draft-n-max"
            - "2"
            - "--cache-ram"             # host-RAM prompt cache OFF: with MTP it crashes on the 2nd request
            - "0"                       #   (GGML_ASSERT tensor not allocated in state_seq_get_data, build 12418)
            # Sampling: Qwen's non-thinking preset (reasoning is off by default, every
            # router decision has use_reasoning: false). Without these the GGUF's
            # thinking-mode defaults applied (temp 1.0, top_p 0.95, presence 0), and
            # with no presence penalty follow-ups re-emitted the previous long answer.
            # Per-request values from clients still override. If HA tool-call JSON or
            # code output degrades, drop presence-penalty to 1.0.
            - "--temp"
            - "0.7"
            - "--top-p"
            - "0.8"
            - "--top-k"
            - "20"
            - "--min-p"
            - "0"
            - "--presence-penalty"
            - "1.5"
            - "-c"
            - "1048576"                 # total KV budget = 4 slots x 262144 native ctx
            - "-np"
            - "4"                       # 4 server slots
            - "--no-kv-unified"         # private per-slot KV: each hard-capped at native 262K
            - "--slot-prompt-similarity"  # send each request to the slot whose cached prompt matches best
            - "0.5"
            - "-t"
            - "16"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--metrics"
          env: []
          # Model load from NFS + 1M-token KV alloc takes ~2min; gate traffic until /health is green.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 60        # up to ~10min before giving up
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "8"
            limits:
              cpu: "16"
              amd.com/gpu: 1
          securityContext:
            privileged: true
          volumeMounts:
            - name: models
              mountPath: /models
            - name: models
              mountPath: /cache
              subPath: cache
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
            - name: shm
              mountPath: /dev/shm
            - name: chat-template
              mountPath: /templates
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
        - name: dri
          hostPath:
            path: /dev/dri
        - name: kfd
          hostPath:
            path: /dev/kfd
        - name: chat-template
          configMap:
            name: qwen38-chat-template
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: llm
spec:
  selector:
    app: llama-server
  ports:
    - port: 8080
      targetPort: 8080
      name: http

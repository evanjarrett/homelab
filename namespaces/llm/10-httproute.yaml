apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama-tls-route
  namespace: llm
spec:
  parentRefs:
    - name: jarrett-net
      namespace: gateway
  hostnames:
    - llama.j5t.io
  rules:
    - backendRefs:
        - name: llama-server
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: git-summarizer-tls-route
  namespace: llm
spec:
  parentRefs:
    - name: jarrett-net
      namespace: gateway
  hostnames:
    - summarize.j5t.io
  rules:
    - backendRefs:
        - name: git-summarizer
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-to-llm
  namespace: llm
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: gateway
  to:
    - group: ""
      kind: Service
---
# Qwen3.5-9B vision on the B50 (vllm-vision), for clients outside the cluster
# such as Home Assistant AI Task image requests. OpenAI API at /v1, no auth
# (internal-only *.j5t.io split-horizon DNS, like llama.j5t.io).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-vision-tls-route
  namespace: llm
spec:
  parentRefs:
    - name: jarrett-net
      namespace: gateway
  hostnames:
    - vision.j5t.io
  rules:
    - backendRefs:
        - name: vllm-vision
          port: 8080
      timeouts:
        request: 300s

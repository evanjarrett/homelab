apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: jarrett-net
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    metallb.universe.tf/loadBalancerIPs: 192.168.3.1
spec:
  gatewayClassName: istio
  listeners:
    - name: jarrettnet
      hostname: "*.jarrett.net"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
              - website
              - proxy
              - loom-system
              - headscale
      tls:
        mode: Terminate
        certificateRefs:
          - name: jarrett-net-tls
    - name: jarrettnetfull
      hostname: "jarrett.net"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
              - website
      tls:
        mode: Terminate
        certificateRefs:
          - name: jarrett-net-full-tls
    - name: jarrettapp
      hostname: "*.jarrett.app"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
              - atproto
      tls:
        mode: Terminate
        certificateRefs:
          - name: jarrett-app-full-tls
    - name: jarrettappfull
      hostname: "jarrett.app"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
              - atproto
      tls:
        mode: Terminate
        certificateRefs:
          - name: jarrett-app-full-tls
    - name: evanjarrettcom
      hostname: "evanjarrett.com"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
              - website
      tls:
        mode: Terminate
        certificateRefs:
          - name: evanjarrett-com-tls
    - name: j5tiofull
      hostname: "j5t.io"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: j5t-io-full-tls
    - name: j5tio
      hostname: "*.j5t.io"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: j5t-io-tls
    # Added for the hold01 migration (namespaces/atproto/30-hold01*.yaml).
    # Scoped to the exact hostname rather than *.atcr.io: atcr.io itself is the
    # appview and is not served from this cluster, so a wildcard listener would
    # claim hostnames this gateway cannot answer for.
    #
    # The gateway-level cert-manager.io/cluster-issuer annotation makes
    # cert-manager's gateway-shim provision the hold01-atcr-io-tls Secret from
    # this listener's hostname. That needs the ACME challenge for
    # hold01.atcr.io to resolve to this gateway (192.168.3.1 via MetalLB),
    # i.e. public DNS for hold01.atcr.io must be cut over BEFORE the
    # certificate can issue. Expect the listener to sit Programmed=False until
    # then.
    - name: hold01atcrio
      hostname: "hold01.atcr.io"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: In
              values:
              - atproto
      tls:
        mode: Terminate
        certificateRefs:
          - name: hold01-atcr-io-tls

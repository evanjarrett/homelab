# `proxy` holds selectorless Services that point at LAN hosts; the gateway
# (Envoy, ns `gateway`) dials those LAN IPs itself. The only pod here is
# whoami, which needs no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: proxy
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: proxy
spec:
  podSelector:
    matchLabels:
      app: whoami
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: gateway
      podSelector:
        matchLabels:
          gateway.networking.k8s.io/gateway-name: jarrett-net
    ports:
    - protocol: TCP
      port: 80

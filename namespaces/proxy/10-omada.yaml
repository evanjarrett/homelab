# Omada controller = Hot-Standby Backup pair on the Pi 5s (pi5-1 .0.22 primary,
# pi5-2 .0.23 secondary; both serve the UI/API and accept changes). Defined here
# instead of the secret-service `endpoints` secret because that only supports one
# address per name.
apiVersion: v1
kind: Service
metadata:
  name: omada-controller
  namespace: proxy
spec:
  ports:
    - name: https
      port: 8043
      targetPort: 8043
      protocol: TCP
      appProtocol: https
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: omada-controller
  namespace: proxy
  labels:
    kubernetes.io/service-name: omada-controller
    endpointslice.kubernetes.io/managed-by: flux
addressType: IPv4
ports:
  - name: https
    port: 8043
    protocol: TCP
    appProtocol: https
endpoints:
  - addresses: ["192.168.0.22"] # pi5-1 (omada)
  - addresses: ["192.168.0.23"] # pi5-2 (omada2)
---
# Pis serve a self-signed cert, so skip verification on the hop to them.
# Login sessions are per-node, so pin each browser to one node with a cookie;
# outlier detection ejects a dead node so traffic moves to the other one.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: omada-controller
  namespace: proxy
spec:
  host: omada-controller.proxy.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
    loadBalancer:
      consistentHash:
        httpCookie:
          name: omada-node
          ttl: 0s
    outlierDetection:
      consecutiveGatewayErrors: 2
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omada-tls-route
  namespace: proxy
spec:
  parentRefs:
    - name: jarrett-net
      namespace: gateway
  hostnames:
    - omada.j5t.io
  rules:
    - backendRefs:
        - name: omada-controller
          namespace: proxy
          port: 8043

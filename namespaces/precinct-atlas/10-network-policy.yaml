apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: precinct-atlas
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Browser traffic arrives through the istio gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-ingress
  namespace: precinct-atlas
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - protocol: TCP
          port: 8080
# No egress policy beyond default-deny: the server only reads the local SQLite
# file and serves it; it makes no outbound calls (not even DNS).

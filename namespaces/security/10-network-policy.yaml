apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: security
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: security
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS to kube-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow kubernetes API access for kubebench. The apiserver is hostNetwork on
  # the control planes, so it can't be matched by namespaceSelector; under
  # Cilium these ipBlocks need `policyCIDRMatchMode: nodes`.
  - to:
    - ipBlock:
        cidr: 192.168.1.161/32
    - ipBlock:
        cidr: 192.168.1.162/32
    - ipBlock:
        cidr: 192.168.1.163/32
    ports:
    - protocol: TCP
      port: 6443
# Knot is authoritative-only. It answers DNS from anywhere and sends NOTIFY /
# serves AXFR to secondaries over port 53; it never speaks HTTPS.
# TODO: narrow the 53 egress to the secondaries listed in knot.conf.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: knotdns
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-ingress
  namespace: knotdns
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  # LAN clients via LoadBalancer (any source).
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: knotdns
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Name resolution plus NOTIFY/AXFR to secondaries.
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

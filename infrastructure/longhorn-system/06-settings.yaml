# Longhorn runtime Settings owned by git. The chart's defaultSettings only seed a
# fresh install and never reconcile an existing Setting CR, so anything we need to
# stay true after install lives here as a Flux-managed Setting.
#
# Auto-upgrade volumes to the new instance-manager/engine image after a Longhorn
# upgrade. This was 0 (off), which left every v2 volume on v1.12.0 for weeks after
# the Aug 1.12.1 upgrade; the resulting 1.12.0/1.12.1 skew broke all replica
# rebuilds on 2026-09-27 (v1.12.1 rejects rebuild connects from 1.12.0 hosts).
# v2 volumes only switch while detached, so still run the post-upgrade check
# (mixed v2 instance-manager images / volume spec.image) after every upgrade.
apiVersion: longhorn.io/v1beta2
kind: Setting
metadata:
  name: concurrent-automatic-engine-upgrade-per-node-limit
  namespace: longhorn-system
value: "3"

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu-helmrelease
  namespace: kube-system
spec:
  dependsOn:
    - name: intel-device-plugin-operator-helmrelease
  releaseName: intel-device-plugin-gpu
  interval: 2h
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.37.2
      sourceRef:
        kind: HelmRepository
        name: intel-helmrepo
        namespace: flux-system
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    nodeFeatureRule: true
    denyIDs: "0x9bc5"  # Exclude UHD 630 iGPU, only expose discrete GPUs
    # Overcommit each B50 so Frigate (light transcode only; detection is on the
    # Corals) can share a card with a small vLLM model. No VRAM isolation:
    # model pods must cap themselves via --gpu-memory-utilization.
    sharedDevNum: 2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-operator-helmrelease
  namespace: kube-system
spec:
  releaseName: intel-device-plugin-operator
  interval: 15m
  chart:
    spec:
      chart: intel-device-plugins-operator
      version: 0.37.2
      sourceRef:
        kind: HelmRepository
        name: intel-helmrepo
        namespace: flux-system
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  # The chart's Services select only `control-plane: controller-manager`, which
  # the AMD GPU operator's controller (also kube-system, also kubebuilder) carries
  # too. The webhook Service then load-balances onto the AMD pod, ~half of all
  # GpuDevicePlugin admissions get "connection refused", and every GPU plugin
  # upgrade fails. Add a unique label to the pod and to both selectors (the
  # Deployment's own immutable selector is left alone).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: inteldeviceplugins-controller-manager
            patch: |
              - op: add
                path: /spec/template/metadata/labels/app.kubernetes.io~1name
                value: intel-device-plugins-operator
          - target:
              kind: Service
              name: inteldeviceplugins-(webhook-service|controller-manager-metrics-service)
            patch: |
              - op: add
                path: /spec/selector/app.kubernetes.io~1name
                value: intel-device-plugins-operator

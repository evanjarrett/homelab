apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-helmrelease
  namespace: cert-manager
spec:
  releaseName: cert-manager
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager-helmrepo
        namespace: flux-system
      version: v1.21.3
  interval: 2h
  install:
    createNamespace: true
    remediation:
      retries: 3
  values:
    installCRDs: true
    # DNS-01 propagation checks over DoH (443) instead of plain :53 to the
    # Cloudflare authoritative servers, so the egress NetworkPolicy only
    # needs 443 to the internet.
    dns01RecursiveNameservers: "https://1.1.1.1/dns-query"
    dns01RecursiveNameserversOnly: true
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true

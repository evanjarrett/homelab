apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb-helmrelease
  namespace: metallb
spec:
  releaseName: metallb
  chart:
    spec:
      chart: metallb
      sourceRef:
        kind: HelmRepository
        name: metallb-helmrepo
        namespace: flux-system
      version: 0.16.2
  interval: 2h
  # The frr-k8s and speaker DaemonSets roll one node at a time across ~11
  # nodes, which overruns Helm's default 5m wait and triggers a rollback.
  timeout: 20m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
